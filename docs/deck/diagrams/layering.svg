<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#19415e"/></marker></defs>
<rect width="1280" height="620" fill="#f7f7f5"/>
<text x="40" y="44" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#19415e">Suite layering, as built</text>
<text x="40" y="68" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="13" fill="#5b6b78">Package counts are file counts under src/test/java. Exactly one package imports org.apache.kafka; that is the coupling point to the transport.</text>
<rect x="60" y="110" width="800" height="74" fill="#ffffff" stroke="#19415e" stroke-width="1.5"/>
<text x="82" y="141" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#19415e">features/</text>
<text x="82" y="164" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">Gherkin - 7 committed files + 1 generated from the CSV</text>
<line x1="460" y1="184" x2="460" y2="206" stroke="#19415e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="60" y="218" width="800" height="74" fill="#ffffff" stroke="#19415e" stroke-width="1.5"/>
<text x="82" y="249" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#19415e">steps/</text>
<text x="82" y="272" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">9 classes - translate a step into a harness call</text>
<line x1="460" y1="292" x2="460" y2="314" stroke="#19415e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="60" y="326" width="800" height="74" fill="#EFEFEE" stroke="#26a9be" stroke-width="2.5"/>
<text x="82" y="357" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#19415e">harness/</text>
<text x="82" y="380" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">11 classes - the only package importing org.apache.kafka</text>
<line x1="460" y1="400" x2="460" y2="422" stroke="#19415e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="60" y="434" width="800" height="74" fill="#ffffff" stroke="#19415e" stroke-width="1.5"/>
<text x="82" y="465" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="15" fill="#19415e">model/  contract/  data/  support/  report/  docs/</text>
<text x="82" y="488" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">read-only views, schemas, the CSV, guards and the report generator</text>
<rect x="900" y="110" width="320" height="290" fill="#ffffff" stroke="#19415e" stroke-width="1.5"/>
<text x="920" y="140" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#19415e">Where coupling sits</text>
<text x="920" y="170" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">No dependency on the service</text>
<text x="920" y="194" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">artifact in pom.xml (F-02)</text>
<text x="920" y="218" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78"></text>
<text x="920" y="242" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">0 test files import a service</text>
<text x="920" y="266" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">internal package (F-03)</text>
<text x="920" y="290" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78"></text>
<text x="920" y="314" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">Only harness/ knows Kafka:</text>
<text x="920" y="338" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12.5" fill="#5b6b78">3 of 11 files (F-05)</text>
<rect x="900" y="425" width="320" height="105" fill="#EFEFEE" stroke="#26a9be" stroke-width="1.5"/>
<text x="920" y="452" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#19415e">Maintenance points</text>
<text x="920" y="477" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12" fill="#5b6b78">A new city case: one CSV row</text>
<text x="920" y="497" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12" fill="#5b6b78">A new rule: one feature file</text>
<text x="920" y="517" font-family="Calibri, Montserrat, Helvetica, sans-serif" font-size="12" fill="#5b6b78">A broker upgrade: harness/ only</text>
</svg>