# Broker only — for suite-driven local/CI runs (TEST_SUITE_SPEC.md section 2).
#
# This suite has no compile dependency on the service artifact, so it does
# not start the service. This file brings up only the Kafka broker the
# service and the suite both connect to; the service itself is started
# separately (from an IDE, `java -jar city-enrichment.jar`, or the pipeline's
# own service container — see APP_CHANGE_SPEC.md CH-02/CH-03).
#
# Single-node Kafka in KRaft mode, matching the service's own
# docker-compose.yml topology so `bootstrap.servers=localhost:9092` in
# config/test-local.properties resolves against the same broker either side
# starts. Topic creation is explicit (three named topics, three partitions
# each) rather than relying on auto-create — auto-create gives one partition
# and silently hides a misconfiguration (APP_CHANGE_SPEC.md CH-03, CH-11).
#
#   docker compose -f docker-compose.override.yml up -d      start
#   docker compose -f docker-compose.override.yml ps         status
#   docker compose -f docker-compose.override.yml down -v    stop and wipe the data volume
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: suite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No rebalance delay: a scenario's consumer group joins and gets its
      # partitions immediately, rather than waiting out a production-sized
      # rebalance window on every scenario.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Explicit topic creation only (topic-init below) — see comment above.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - suite-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Base topics only. TopicProvisioner (harness/) creates the per-scenario,
  # per-run topic names derived from the prefixes in config/test-*.properties
  # at test time — this step exists so `kafka-console-producer` and manual
  # smoke checks against the base names work without the suite running first.
  topic-init:
    image: apache/kafka:3.9.0
    container_name: suite-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        for t in booking.raw booking.enriched booking.flagged; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1;
        done;
        echo '--- topics ---';
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --describe

volumes:
  suite-kafka-data:
