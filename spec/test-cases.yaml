# spec/test-cases.yaml
#
# Feeds: section 5/9/10/11.2/14 of the generated Test Execution Summary
# Report -- the planned test case set, i.e. the `cases` array's static
# columns (id, title, module, type, priority, profile) merged at report
# time against cucumber.json's per-case result (status, duration).
#
# Why this cannot be derived from cucumber.json alone (TEST_SUITE_SPEC.md
# section 8.6, Class B): cucumber.json only ever contains what actually
# ran in a given invocation. A tag-filtered run (`-Dcucumber.filter.tags`,
# any of run-tests.sh's five profiles) executes a subset of the 62 defined
# scenarios, and nothing in that output records how many scenarios exist
# in total. Without this file, "executed / planned", execution slippage,
# and "not executed" (as opposed to "does not exist") are all impossible
# to compute -- there is no denominator.
#
# Derivation: scanned, not hand-typed. One entry per @TC-nn tag found in
# src/test/resources/features/**/*.feature and in the generated
# target/test-classes/features/functional/city_correction.feature (itself
# produced from testdata/city-cases.csv by FeatureGenerator -- see
# docs/traceability-matrix.md's note on why that file traces to two
# sources at once). module/type/priority are copied verbatim off each
# scenario's own tag line; profile from @fast/@slow/@nightly. Title is the
# literal `Scenario:` / `Scenario Outline:` text, including the TC id
# where the generated feature embeds it in the title itself.
#
# 62 cases total: TC-01..TC-29, TC-30..TC-45, TC-50..TC-55, TC-60..TC-64,
# TC-70..TC-75 (id ranges are not contiguous -- see TEST_SUITE_SPEC.md
# section 7 and docs/traceability-matrix.md for why).
#
# TC-34, TC-38 and TC-60 are Scenario Outlines: Cucumber tags an outline,
# not an individual Examples row, so each still contributes exactly one
# entry here (per docs/TAGGING_GUIDELINE.md section 1) even though it
# expands to more than one executed scenario in cucumber.json.
#
# TC-60..TC-64 carry both @nightly and @slow; profile below records
# "nightly" because that is the run-tests.sh/budgets.yaml bucket the
# volume suite is actually run and time-budgeted under (TEST_SUITE_SPEC.md
# section 9.3/9.4, README's "Running the suite" table) -- see the `note`
# field on each of those five entries.

