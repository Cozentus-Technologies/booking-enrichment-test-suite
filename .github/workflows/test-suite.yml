# CI for the booking-enrichment black-box test suite.
#
# Two tiers, because they need different things:
#
#   unit         needs nothing. Runs on every push and pull request today.
#                55 tests: the CSV loader, the feature generator, schema
#                validation, the compatibility checker, the coverage reporter.
#
#   integration  needs a Kafka broker AND a running service instance, which
#                means cloning the private service repository. That needs a
#                credential this repository does not have. Deploy keys are
#                disabled org-wide, so the options are a fine-grained PAT stored
#                as SERVICE_TOKEN, or enabling deploy keys for the org. Until one
#                exists the job is skipped, not failed: a red badge for a missing
#                credential teaches nobody anything.
name: test-suite

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "run-tests.sh profile to execute"
        required: false
        default: full
        type: choice
        options: [smoke, functional, contract, full, nightly]

env:
  SERVICE_REPO: DSV-test-assignement
  SERVICE_REF: main
  SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}

jobs:
  unit:
    name: Suite's own tests (no broker, no service)
    runs-on: ubuntu-latest
    outputs:
      # A job-level `if` cannot read the secrets context, so whether the
      # credential exists is published here and the integration jobs gate on it.
      has_service_key: ${{ steps.credential.outputs.present }}
    steps:
      - uses: actions/checkout@v5

      - name: Is a service credential configured?
        id: credential
        run: |
          if [ -n "${SERVICE_SSH_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "SERVICE_SSH_KEY is set; the integration jobs will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SERVICE_SSH_KEY is not set, so the integration jobs are skipped."
            echo "They need to clone the private service repository to build and start it."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Excludes RunCucumberTest and anything tagged kafka, so this passes or
      # fails on the suite's own logic and nothing else.
      - name: mvn test
        run: mvn -B test

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  fast:
    needs: unit
    # @smoke and @functional-and-@critical on every push/PR — the two-minute
    # budget in TEST_SUITE_SPEC.md section 9.4.
    if: needs.unit.outputs.has_service_key == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start broker
        run: docker compose -f docker-compose.override.yml up -d --wait

      - name: Authorise the read-only deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVICE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      # Only builds the jar. The suite starts its own service instance per
      # scenario, on its own topics and its own port; a pre-started one would
      # subscribe to the default topics that no scenario ever uses.
      - name: Check out and build the service under test
        run: |
          GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            git clone --depth 1 --branch "$SERVICE_REF" \
            "git@github.com:${{ github.repository_owner }}/$SERVICE_REPO.git" service
          cd service
          mvn -q -DskipTests package
          ls -l target/city-enrichment.jar

      - name: Run suite
        env:
          SUITE_ENV: ci
        run: ./run-tests.sh functional


      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-reports
          path: |
            target/cucumber-reports/
            target/allure-results/
            target/scenario-coverage.md

  nightly:
    needs: unit
    # @nightly volume suite — unbounded budget, scheduled separately from the
    # fast per-commit slice above.
    if: needs.unit.outputs.has_service_key == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'nightly'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start broker
        run: docker compose -f docker-compose.override.yml up -d --wait

      - name: Authorise the read-only deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVICE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      # Only builds the jar. The suite starts its own service instance per
      # scenario, on its own topics and its own port; a pre-started one would
      # subscribe to the default topics that no scenario ever uses.
      - name: Check out and build the service under test
        run: |
          GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            git clone --depth 1 --branch "$SERVICE_REF" \
            "git@github.com:${{ github.repository_owner }}/$SERVICE_REPO.git" service
          cd service
          mvn -q -DskipTests package
          ls -l target/city-enrichment.jar

      - name: Run nightly (volume) suite
        env:
          SUITE_ENV: ci
        run: ./run-tests.sh nightly


      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-reports-nightly
          path: |
            target/cucumber-reports/
            target/allure-results/
            target/scenario-coverage.md
