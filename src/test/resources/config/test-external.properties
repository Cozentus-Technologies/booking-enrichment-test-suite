# ==============================================================================
# test-external.properties
# Suite configuration for pointing at a deployment this suite did not
# provision: broker and service are already running somewhere else, put there
# by someone else's pipeline or by hand. Activated with -Dsuite.env=external
# (see pom.xml / TestConfig.java).
#
# This is the design goal stated in TEST_SUITE_SPEC.md section 3 and
# docs/MAINTENANCE.md's layering table ("Point at DSV's real service ->
# config/test-*.properties only"): three values actually matter here — the
# broker endpoint, the running deployment's real topic names, and the
# readiness URL. Everything else in this file either keeps the same key
# names as test-local.properties/test-ci.properties for TestConfig's sake,
# or is explicitly documented below as not applicable to this profile.
#
# Same key set as test-local.properties/test-ci.properties (TestConfig reads
# the same keys regardless of profile); what differs is what several of the
# values *mean* under this profile, not just their host names. Read the
# per-key comments below, not just the values.
# ==============================================================================

# --- Kafka broker -------------------------------------------------------------
# Address of the already-running broker behind the deployment under test.
# Not a broker this suite starts or owns — replace with the real endpoint
# before use, or override per run with -Dkafka.bootstrap.servers=host:port
# (TestConfig: system property beats file, so no edit is required to point
# at a different external deployment for a single run).
kafka.bootstrap.servers=external-broker.example.com:9092

# --- Topic names ----------------------------------------------------------------
# IMPORTANT: under local/ci these are prefixes that KafkaServiceHarness
# suffixes with a fresh UUID per scenario (<prefix>.<scenarioId>), because
# this suite provisions and deletes its own topics for isolation
# (TEST_SUITE_SPEC.md section 9.5). Against someone else's deployment the
# suite has no authority to create topics, and the running service is
# already wired to fixed topic names it did not get from us — so the values
# below must be the deployment's REAL, exact topic names, used as-is, not a
# prefix to build a scenario-scoped name from.
#
# Consequence, and it is a real one: scenario isolation by unique topic is
# NOT available on this profile. Every scenario run against the same
# external deployment shares these three topics with whatever other traffic
# that deployment carries — other scenarios in the same run, another
# engineer's run, or production-shaped traffic if this is pointed at
# something more than a test deployment. Correlation therefore relies
# entirely on bookingId (KafkaServiceHarness.awaitEnriched/awaitFlagged
# already key off bookingId, never off arrival order or topic ownership),
# and every assertion — especially an absence assertion via
# nothingArrivedFor() — must tolerate unrelated messages already sitting on,
# or arriving on, these topics during the window. An absence claim here is
# weaker evidence than on local/ci for exactly this reason: it is a bounded
# observation on a shared topic, not a channel this run owns exclusively.
topic.raw.prefix=booking.raw
topic.enriched.prefix=booking.enriched
topic.flagged.prefix=booking.flagged

# --- Consumer group prefix -----------------------------------------------------
# Unlike the topics above, a consumer group is this suite's own identity on
# the broker, not something the deployment owner provisioned — Kafka creates
# it on first subscribe. A per-scenario suffix is still safe and still
# useful here: it keeps this run's consumers from colliding with another
# engineer's run against the same shared deployment, even though the
# underlying topic traffic itself cannot be separated the same way.
consumer.group.prefix=city-enrichment-suite-external

# --- Service readiness ----------------------------------------------------------
# GET /ready on the ALREADY-RUNNING deployment, not on an instance this
# suite starts. Point this at the real host:port the deployment exposes
# its readiness endpoint on. Hooks.startIsolatedService still polls this
# before a scenario publishes, for the same reason as every other profile:
# subscribe does not replay history, so publishing before the running
# service is actually up would lose the message for a reason that has
# nothing to do with the behaviour under test.
service.readiness.url=http://external-service.example.com:8081/ready

# --- Timeouts (TEST_SUITE_SPEC.md section 4) ------------------------------------
# Deliberately WIDER than local/ci, unlike test-ci.properties' timeouts
# (which stay identical to local because a busier CI runner is a
# pipeline-infrastructure problem, not a reason to widen a contract
# timeout). A real external broker and service sit behind actual network
# hops instead of localhost, so extra margin here is accounting for
# physically slower round trips, not padding over a shared machine being
# busy — a different justification from the one test-ci.properties rejects.

# Bounded poll for a message to appear on an output topic.
await.timeout.seconds=30

# Bounded poll used by assertNothingFor() to confirm a message's absence
# from a topic. Widened along with the others, but remember this window is
# also where the "shared topic, other traffic" caveat above bites hardest:
# a longer window makes the absence claim more convincing, never conclusive.
absence.window.seconds=15

# Bounded poll for GET /ready to return 200 before any scenario publishes.
# Generous already on local for a cold laptop; wider still here because
# there is no local startup to wait out, only network latency to a host
# that should already be warm — kept high anyway as a safety margin against
# an unfamiliar network path.
readiness.timeout.seconds=60

# Ceiling for a volume/bulk run (TC-60..TC-64) to fully drain both output
# topics. Widened for the same network-hop reasoning, and because a shared
# deployment may be serving other traffic concurrently with the bulk run.
volume.timeout.seconds=300

# Path to the built service jar. UNUSED under this profile: nothing here
# starts a service process. The deployment behind kafka.bootstrap.servers
# and service.readiness.url above is assumed already running and ready;
# ServiceController's own javadoc states this is the point of the external
# profile ("it starts nothing and only waits"). The key is left in place,
# pointing at the same location as test-local.properties, purely so
# TestConfig.required("service.jar.path") still resolves to a value; it is
# never read for a meaningful path under this profile.
service.jar.path=../DSV-test-assignement/target/city-enrichment.jar

# The committed 200-row sample and its oracle. Not affected by which
# deployment is under test: this is read from the local checkout regardless
# of profile, the same as test-local.properties, since it is the suite's
# own fixture data rather than anything the running service provides.
sample.data.path=../DSV-test-assignement/data/bookings-sample.jsonl
sample.oracle.path=../DSV-test-assignement/data/bookings-sample.jsonl.expected.json
