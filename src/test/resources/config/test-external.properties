# ==============================================================================
# test-external.properties
# Suite configuration for a deployment this suite did not provision: broker and
# service are already running, put there by somebody else's pipeline or by hand.
# Activated with -Dsuite.env=external.
#
# Every value below is read by TestConfig, and every value a run needs is listed
# with its default and whether it is required in README.md, "External profile
# configuration". Keep the two in step.
#
# What differs under this profile is not only the host names but what several of
# the values MEAN, so read the per-key comments rather than only the values:
#
#   - the topic keys are exact names, not prefixes (see below);
#   - service.jar.path is absent on purpose, and its absence is load-bearing;
#   - the timeouts are wider, for a reason test-ci.properties deliberately rejects.
#
# Nothing here is created, altered or removed by the suite. It starts no
# process, creates no topic and deletes no topic. Run `bash run-tests.sh
# preflight` first: it says which of broker, topics and readiness is missing
# before a run spends twenty minutes discovering it one scenario at a time.
# ==============================================================================

# --- Kafka broker -------------------------------------------------------------
# Address of the already-running broker behind the deployment under test. The
# placeholder below is not a working default and is not meant to be: there is no
# sensible guess at somebody else's broker, so a run that has not been told where
# to look should fail rather than quietly probe the wrong one. Override per run
# with -Dkafka.bootstrap.servers=host:port (system property beats file), or edit
# this file for a deployment you point at regularly.
kafka.bootstrap.servers=external-broker.example.com:9092

# --- Topic names ----------------------------------------------------------------
# IMPORTANT: the key names still say "prefix" because TestConfig reads the same
# keys on every profile, but under this profile these are NOT prefixes. Under
# local and ci KafkaServiceHarness appends .<scenarioId> and provisions the
# result, because the suite owns the broker. Here it has no authority to create a
# topic and the running service is already bound to fixed names it did not get
# from us, so these values are used verbatim.
#
# Consequence, and it is a real one: scenario isolation by unique topic is not
# available on this profile. Every scenario shares these three topics with
# whatever else the deployment carries - other scenarios in this run, another
# engineer's run, production-shaped traffic. Isolation comes instead from
# RunScope: every booking id this run publishes is prefixed RUN-<uuid8>-, the
# consumers seek to the end of each topic on assignment so history is not
# replayed, and a message not carrying this run's prefix is not this run's
# business. An absence assertion is still weaker evidence here than on local: it
# is a bounded observation on a topic this run does not own.
topic.raw.prefix=booking.raw
topic.enriched.prefix=booking.enriched
topic.flagged.prefix=booking.flagged

# --- Consumer group prefix -----------------------------------------------------
# Unlike the topics above, a consumer group is this suite's own identity on the
# broker rather than something the deployment owner provisioned - Kafka creates
# it on first subscribe. A per-scenario suffix is still applied, so this run's
# consumers cannot collide with another engineer's run against the same
# deployment.
consumer.group.prefix=city-enrichment-suite-external

# --- Service readiness ----------------------------------------------------------
# GET /ready on the ALREADY-RUNNING deployment. Polled before any scenario
# publishes, for the same reason as on every other profile: subscribe does not
# replay history, so publishing before the service is serving loses the message
# and the scenario then fails for a reason that has nothing to do with the
# behaviour under test. A placeholder, for the same reason as the broker address.
service.readiness.url=http://external-service.example.com:8081/ready

# --- Timeouts -------------------------------------------------------------------
# Deliberately WIDER than local and ci. test-ci.properties refuses to widen its
# timeouts because a busier shared runner is a pipeline-infrastructure problem
# rather than a reason to move a contract timeout. This is a different
# justification: a real broker and a real service sit behind actual network hops
# instead of localhost, so the extra margin buys physically slower round trips,
# not headroom over a busy machine.

# Bounded poll for a message to appear on an output topic.
await.timeout.seconds=30

# Bounded poll for confirming a message's absence from a topic. Widened with the
# others, and this is where the shared-topic caveat above bites hardest: a longer
# window makes an absence claim more convincing, never conclusive.
absence.window.seconds=15

# Bounded poll for GET /ready to return 200 before any scenario publishes. There
# is no local startup to wait out here, only an unfamiliar network path to a host
# that should already be warm - kept generous as a margin against that path
# rather than against a cold JVM.
readiness.timeout.seconds=60

# Ceiling for a volume run (TC-60..TC-64) to drain both output topics. Widened
# for the same network reasoning, and because a shared deployment may be serving
# other traffic while the bulk run is in flight.
volume.timeout.seconds=300

# --- service.jar.path: deliberately absent ---------------------------------------
# Not an oversight. Under this profile the suite starts no process, so there is no
# jar to find and ServiceController never reaches for this key. It used to be
# listed here "so TestConfig.required() still resolves to a value", which meant a
# code path that did reach for it would quietly succeed against whatever jar
# happened to be on the machine: the deployment under test and a process the
# suite started would then both be consuming the same topics, and the suite would
# be reporting on the wrong one. Its absence is what makes that impossible, and
# TestConfigTest pins it.

# The committed 200-row sample and its oracle, used by the volume scenarios. Read
# from the local checkout whichever deployment is under test: this is the suite's
# own fixture data, not anything the running service provides.
sample.data.path=../DSV-test-assignement/data/bookings-sample.jsonl
sample.oracle.path=../DSV-test-assignement/data/bookings-sample.jsonl.expected.json
