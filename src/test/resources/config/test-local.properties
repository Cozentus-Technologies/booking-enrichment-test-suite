# ==============================================================================
# test-local.properties
# Suite configuration for a developer machine: broker started via
# docker-compose.override.yml, service started from an IDE or a runnable jar.
# See TEST_SUITE_SPEC.md section 4 (harness contract / timeouts) and
# APP_CHANGE_SPEC.md CH-04 (the service's own configuration surface).
#
# Loaded by support/TestConfig.java. Never read by matcher/enrich code —
# this file lives entirely on the suite side of the black-box boundary.
# ==============================================================================

# --- Kafka broker -------------------------------------------------------------
# Address of the single-node KRaft broker started by docker-compose.override.yml.
kafka.bootstrap.servers=localhost:9092

# --- Topic name prefixes -------------------------------------------------------
# The suite provisions a unique topic per scenario for isolation
# (TEST_SUITE_SPEC.md section 9.5): <prefix>.<scenarioId>.<suffix>.
# The prefixes below must match the service's own topic.raw / topic.enriched /
# topic.flagged defaults (APP_CHANGE_SPEC.md CH-04) so TopicProvisioner derives
# scenario-scoped names the running service instance is actually configured for.
topic.raw.prefix=booking.raw
topic.enriched.prefix=booking.enriched
topic.flagged.prefix=booking.flagged

# --- Consumer group prefix -----------------------------------------------------
# Each scenario gets its own consumer group: <prefix>.<scenarioId>, so no two
# scenarios ever share a group and offsets cannot leak between runs.
consumer.group.prefix=city-enrichment-suite

# --- Service readiness ----------------------------------------------------------
# GET /ready on the service under test (APP_CHANGE_SPEC.md CH-05).
# Default readiness.port in the service is 8081; override with READINESS_PORT
# if the local instance is started on a different port.
service.readiness.url=http://localhost:8081/ready

# --- Timeouts (TEST_SUITE_SPEC.md section 4) ------------------------------------
# Bounded poll for a message to appear on an output topic. No sleeps anywhere
# in the suite; every wait is a bounded poll against this value.
await.timeout.seconds=10

# Bounded poll used by assertNothingFor() to confirm a message's absence from a
# topic. This is a bounded observation, not a proof of absence — documented as
# such in the harness contract. Kept short because it runs on the critical
# routing-negative-assertion path (TC-32) on every fast run.
absence.window.seconds=5

# Bounded poll for GET /ready to return 200 before any scenario publishes.
# Generous because it covers cold broker + cold service startup on a laptop.
readiness.timeout.seconds=30

# Ceiling for a volume/bulk run (TC-60..TC-64) to fully drain both output
# topics. Not a performance assertion — only a bound so a stalled run fails
# fast instead of hanging the pipeline.
volume.timeout.seconds=120

# Path to the built service jar, which the suite starts per scenario.
# Build it with `mvn package -DskipTests` in the service repository.
service.jar.path=../DSV-test-assignement/target/city-enrichment.jar

# The committed 200-row sample and its oracle, reused from the service repository
# rather than generated afresh: the oracle there is labelled by running the real
# matcher, so it cannot drift from the matching contract (TEST_SUITE_SPEC 5.3).
sample.data.path=../DSV-test-assignement/data/bookings-sample.jsonl
sample.oracle.path=../DSV-test-assignement/data/bookings-sample.jsonl.expected.json
