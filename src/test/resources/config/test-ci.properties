# ==============================================================================
# test-ci.properties
# Suite configuration for the pipeline profile (TEST_SUITE_SPEC.md section 9.1):
# the broker is started by docker-compose in the pipeline job, and the SUITE
# starts the service itself, one instance per scenario, from the jar the pipeline
# built at service.jar.path below. The pipeline's job is to clone and build the
# service, not to run it. Activated with -Dsuite.env=ci (see pom.xml).
#
# It used to say the service was "started by the pipeline before the test step
# runs", which no workflow step does and which Hooks would ignore if it did: an
# instance on fixed topics cannot serve the scenario-scoped topics the suite
# provisions. Pointing the suite at a service the pipeline deployed is
# suite.env=external.
#
# Same keys as test-local.properties; only host names, and the timeout margins
# that account for a shared, slower CI runner, differ.
# ==============================================================================

# --- Kafka broker -------------------------------------------------------------
# Service name of the Kafka container on the pipeline's docker network, per
# .github/workflows/test-suite.yml. Not localhost: the suite runs as another
# container/service on that network, not on the runner's own network namespace.
# The compose file publishes 9092 to the host, and the suite runs on the
# runner rather than inside a container, so localhost is correct here.
kafka.bootstrap.servers=localhost:9092

# --- Topic name prefixes -------------------------------------------------------
# Must match the service's topic.raw / topic.enriched / topic.flagged defaults,
# same reasoning as test-local.properties.
topic.raw.prefix=booking.raw
topic.enriched.prefix=booking.enriched
topic.flagged.prefix=booking.flagged

# --- Consumer group prefix -----------------------------------------------------
# Includes the CI run so re-runs of the same commit never collide with a
# previous attempt's still-committing consumer group.
consumer.group.prefix=city-enrichment-suite-ci

# --- Service readiness ----------------------------------------------------------
# Read only under suite.env=external, and by `run-tests.sh preflight`. As on
# local, each instance this profile starts gets an ephemeral port of its own, so
# nothing polls this URL during a ci run. Kept so the key set matches across
# profiles.
service.readiness.url=http://city-enrichment:8081/ready

# --- Timeouts (TEST_SUITE_SPEC.md section 4) ------------------------------------
# Locked, identical to test-local.properties: these are contract timeouts (how
# long a correct service takes to respond), not a machine-speed allowance, so
# the CI profile does not get its own margin. If a shared runner genuinely
# needs more headroom, that is a pipeline-infrastructure problem to fix, not a
# reason to widen a locked timeout quietly in one properties file.
await.timeout.seconds=10
absence.window.seconds=5
readiness.timeout.seconds=30
volume.timeout.seconds=120

# Path to the built service jar, which the suite starts per scenario.
# Build it with `mvn package -DskipTests` in the service repository.
# CI clones the service into ./service inside this workspace.
service.jar.path=service/target/city-enrichment.jar

# The committed 200-row sample and its oracle, reused from the service repository
# rather than generated afresh: the oracle there is labelled by running the real
# matcher, so it cannot drift from the matching contract (TEST_SUITE_SPEC 5.3).
sample.data.path=service/data/bookings-sample.jsonl
sample.oracle.path=service/data/bookings-sample.jsonl.expected.json
