# Cucumber-JVM configuration for the JUnit Platform engine.
# Values copied verbatim from TEST_SUITE_SPEC.md section 8.1 — do not reformat
# the plugin list; cucumber.plugin is comma-separated and continuation lines
# must keep the trailing backslash.
cucumber.plugin=html:target/cucumber-reports/index.html, \
  json:target/cucumber-reports/cucumber.json, \
  junit:target/cucumber-reports/cucumber.xml, \
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.glue=com.cozentus.enrichment.tests
cucumber.publish.quiet=true
