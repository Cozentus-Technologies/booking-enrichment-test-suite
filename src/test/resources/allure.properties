# Allure reporting configuration.
# Where AllureCucumber7Jvm (wired via junit-platform.properties cucumber.plugin)
# writes result JSON files. Overridable at run time with
# -Dallure.results.directory=<path>; also set as a surefire system property in
# pom.xml so both mechanisms agree.
allure.results.directory=target/allure-results
